<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins&display=swap" rel="stylesheet">

<style>

/* BACKGROUND (same as dashboard) */
body {
   margin: 0;
   font-family: 'Poppins', sans-serif;
   background-image: url(https://i.pinimg.com/736x/80/0b/06/800b06da4c31607fa3dc6700629df9b3.jpg);
   background-size: cover;
   background-position: center;
   min-height: 100vh;
   position: relative;
   display: flex;
   flex-direction: column;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(
        rgba(255, 200, 230, 0.35),
        rgba(200, 220, 255, 0.35)
    );
    backdrop-filter: blur(2px);
    z-index: -1;
}

/* SIDEBAR */
.sidebar{
   background: linear-gradient(#6ec1e4,#2aa3d6);
   text-align: center;
   padding: 20px;
   min-height: 100vh;
   position: sticky;
   top: 0;
   box-shadow: #cf8585 0px 4px 8px;
}

.logo img{
   width:120px;
}

.nav-link{
   color:white;
   font-size:18px;
   padding:12px;
   border-top:1px solid rgba(255,255,255,0.3);
}

/* PAGE TITLE */
.page-title{
   font-family:'Great Vibes',cursive;
   font-size:45px;
   color:white;
   text-shadow:2px 2px 10px #ff69b4;
   text-align:center;
   margin-bottom:30px;
}

/* CARD STYLE (dashboard style) */
.profile-card{
    background: #f7bedb;
    border: 4px solid #ffd48e;
    border-radius: 25px;
    box-shadow: 0 0 15px rgba(198, 136, 145, 0.5);
    padding: 20px;
    font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
   color: #903d3d;
}

/* INNER BOX */
.inner-box{
    padding:20px;
    border: 4px solid #ffd48e;
    border-radius: 15px;
    text-align:center;
}

/* PROFILE IMAGE */
.Sam {
    width:150px;
    height:150px;
    border-radius:50%;
    object-fit:cover;
    border: 4px solid #ffd48e;
}

/* BUTTON */
.btn-custom{
    background:#ff6fa5;
    color:white;
    border:none;
    border-radius:20px;
    padding:8px 15px;
}

.btn-custom:hover{
    background:#ff4d94;
}

/* TEXT */
.label{
    color:gray;
    font-size:14px;
}

/* FOOTER */
footer{
    text-align:center;
    color:#903d3d;
    margin-top:30px;
}

</style>
</head>

<body>

<div class="container-fluid">
<div class="row min-vh-100">

<!-- SIDEBAR -->
<div class="col-md-3 sidebar">

   <div class="logo">
       <img src="https://static.wikia.nocookie.net/logopedia/images/9/9e/Royale_High_2018.png/revision/latest/scale-to-width-down/200?cb=20230624134118">
   </div>

   <br>

   <a class="nav-link" href="dashboard.html">DASHBOARD</a>
   <a class="nav-link" href="notebooks.html">NOTEBOOKS</a>
   <a class="nav-link" href="tasks.html">TASKS</a>
   <a class="nav-link" href="profile.html">PROFILE</a>
   <a class="nav-link" href="index.html">LOGOUT</a>

</div>

<!-- MAIN -->
<div class="col-md-9 d-flex flex-column align-items-center mt-5">

    <h1 class="page-title">Profile </h1>

    <div class="row w-100 px-4 g-4">

        <!-- INFO -->
        <div class="col-md-6">
            <div class="profile-card">
                <div class="inner-box">

                    <h3>Student Information</h3>

                    <p class="label">Student ID</p>
                    <p>SN654321</p>

                    <p class="label">Contact Number</p>
                    <p>+639100000015</p>

                    <p class="label">Email</p>
                    <p>randomemail@gmail.com</p>

                    <button class="btn-custom mt-2" onclick="hubert()">Change Password</button>

                </div>
            </div>
        </div>

        <!-- PICTURE -->
        <div class="col-md-6">
            <div class="profile-card">
                <div class="inner-box">

                    <h3>Profile Picture</h3>

                    <img id="preview" class="Sam" src="default.jpg">

                    <br><br>

                    <input type="file" id="fileInput" class="form-control">

                </div>
            </div>
        </div>

    </div>

    <footer class="text-center p-3" style=" font-family: Poppins, sans-serif; color: #903d3d;">
    <p>&copy; 2026 Fairview ICT9 Topaz. All rights reserved. Bautista, Lacuesta, Lorenzo.</p>
</footer>

</div>

</div>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');

fileInput.addEventListener('change', function(event) {
  const file = event.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      preview.src = e.target.result; 
    };
    reader.readAsDataURL(file);
  }
});

function hubert(){
  alert("Time before changing current password: 67 years");
}
</script>

</body>
</html>
