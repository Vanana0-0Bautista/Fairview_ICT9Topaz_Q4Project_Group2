<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        
body{
   background: #eac4cf;
   font-family: 'Poppins', sans-serif;
}


/* SIDEBAR */
.sidebar{
   background: linear-gradient(#6ec1e4,#2aa3d6);
   height: 100vh;
   text-align: center;
   padding: 20px;
}


.logo img{
   width:120px;
}


.nav-link{
   color:white;
   font-size:18px;
   padding:12px;
   border-top:1px solid rgba(255,255,255,0.3);
}


/* ID CARD */
.card-id{
   background: linear-gradient(180deg,#ff9ecb,#ffd9f2);
   border-radius:25px;
   padding:25px;
   box-shadow:0 15px 30px rgba(0,0,0,0.3);
   position:relative;
   border:5px solid white;
}


/* HEADER */
.header{
   display:flex;
   align-items:center;
   justify-content:space-between;
}


.header img{
   height:60px;
}


.title{
   font-family:'Great Vibes',cursive;
   font-size:40px;
   color:white;
   text-shadow:2px 2px 10px #ff69b4;
}


/* LACE LINE */
.lace{
   height:15px;
   background:url('https://png.pngtree.com/png-clipart/20221009/original/pngtree-white-lace-border-png-image_8674976.png');
   background-size:contain;
}


/* LABEL */
.label{
   background:#ff6fa5;
   color:white;
   padding:5px 15px;
   border-radius:20px;
   font-size:13px;
   display:inline-block;
}

    </style>
    
</head>
<body>


    <div class="container-fluid">
    <div class="row">


    <div class="col-md-3 sidebar">


   <div class="logo">
       <img src="https://static.wikia.nocookie.net/logopedia/images/9/9e/Royale_High_2018.png/revision/latest/scale-to-width-down/200?cb=20230624134118">
   </div>

    <br>

   <a class="nav-link" href="tasks.html">TASKS</a>
   <a class="nav-link" href="profile.html">PROFILE</a>
   <a class="nav-link" href="#">LOGOUT</a>


</div>


    
</body>
</html>
